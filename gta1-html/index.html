<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA 1 Style - Driving MVP</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="controls-hint">
            <strong>Controls:</strong> WASD or Arrow Keys to drive | Space = Handbrake
        </div>
        <!-- Mobile Controls -->
        <div class="mobile-controls">
            <div class="dpad">
                <button class="dpad-btn up" data-key="up">▲</button>
                <button class="dpad-btn left" data-key="left">◀</button>
                <button class="dpad-btn right" data-key="right">▶</button>
                <button class="dpad-btn down" data-key="down">▼</button>
            </div>
            <button class="handbrake-btn" data-key="space">BRAKE</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
